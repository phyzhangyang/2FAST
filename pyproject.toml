[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "2FAST"
version = "0.1.0"
description = "Two-Field Action Semianalytic Tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "2FAST contributors"}]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
2fast = "twofast.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twofast"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
